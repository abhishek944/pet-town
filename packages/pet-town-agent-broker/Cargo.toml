[package]
name = "pet-town-agent-broker"
version = "0.1.0"
description = "Shared local agent discovery and focus broker for Pet Town"
authors = ["pet-town contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
