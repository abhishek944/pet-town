<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Pet Town v2</title>
    <link rel="stylesheet" href="/src/game.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body data-mode="overlay">
    <canvas id="game" aria-hidden="true"></canvas>
    <div id="pet-labels" aria-hidden="true"></div>
    <div id="semantic-village" class="sr-only" role="group" aria-label="Live agent pets"></div>
    <label class="sr-only" for="command-input">Ask a pet to act</label
    ><input
      id="command-input"
      class="command-input"
      autocomplete="off"
      aria-describedby="command-status"
    />
    <p id="command-status" class="sr-only" role="status" aria-live="polite"></p>
    <div id="semantic-actions" class="sr-only" role="menu" aria-label="Pet actions"></div>
  </body>
</html>
