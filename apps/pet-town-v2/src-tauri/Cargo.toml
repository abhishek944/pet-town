[package]
name = "pet-town-v2"
version = "0.1.0"
description = "Excalibur-native Pet Town v2"
authors = ["pet-town contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "pet_town_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pet-town-v2"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow"] }
