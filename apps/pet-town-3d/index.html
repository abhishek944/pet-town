<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pet Town</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        background: #bfe6ff;
        height: 100%;
        margin: 0;
        font-family: ui-rounded, Nunito, system-ui, sans-serif;
        overflow: hidden;
      }
      canvas#game {
        touch-action: none;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        pointer-events: none;
        position: fixed;
        inset: 0;
      }
    </style>
    <script type="module" crossorigin src="/src/main.js"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Pet Town">
      <style>
        @font-face {
          font-family: Fraunces;
          src: url("/fonts/fraunces-700.ttf");
          font-weight: 700;
          font-display: swap;
        }
        #boot {
          z-index: 30;
          background: linear-gradient(#bfe6ee, #f4ecd4);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 38px;
          position: fixed;
          inset: 0;
        }
        #boot b {
          position: relative;
          color: #fff2d0;
          font:
            700 clamp(40px, 8.4vw, 107px)/1 Fraunces,
            Georgia,
            serif;
          letter-spacing: -0.055em;
          background: linear-gradient(#ab7645, #9a643c);
          border: 5px solid #dcb481;
          border-radius: 34px 45px 29px 37px;
          padding: 30px 65px;
          transform: rotate(-2deg);
          box-shadow:
            0 8px 0 #63462b,
            0 20px 30px #172e294f;
          text-shadow: 0 3px #5a3e26;
        }
        #boot b::after {
          content: "";
          position: absolute;
          inset: 10px;
          border: 1px solid #e5c49580;
          border-radius: 22px 32px 18px 25px;
        }
        #boot span {
          color: #73573b;
          font:
            700 14px ui-rounded,
            system-ui,
            sans-serif;
        }
        #boot u {
          width: 220px;
          height: 8px;
          border-radius: 8px;
          overflow: hidden;
          background: #fff8e5;
          position: relative;
        }
        #boot u::after {
          content: "";
          width: 40%;
          position: absolute;
          inset: 0;
          border-radius: 8px;
          background: #79935b;
          animation: bootbar 1.1s ease-in-out infinite alternate;
        }
        @keyframes bootbar {
          from {
            transform: translateX(-10%);
          }
          to {
            transform: translateX(160%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot u::after {
            animation: none;
            width: 100%;
            opacity: 0.6;
          }
        }
      </style>
      <b>Pet Town</b><span>Waking up the town…</span><u aria-hidden="true"></u>
    </div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
  </body>
</html>
