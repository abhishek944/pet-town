<button type="button" class="pet-back" data-pet="back">← Companion controls</button>
<div class="pet-section-title">
  <div>
    <h2>Choose a pet</h2>
    <p>Woodland + storybook · Eight friends, one town.</p>
  </div>
  <span class="pet-pill">8 pets</span>
</div>
<section class="pet-preview" aria-label="Pet preview">
  <div class="pet-stage" role="group">
    <div class="pet-model" aria-hidden="true"></div>
    <button type="button" class="pet-turn" data-pet="turn">↻ Turn around</button>
  </div>
  <div class="pet-detail">
    <p class="pet-species" data-pet="species"></p>
    <h3 data-pet="name"></h3>
    <p class="pet-description" data-pet="description"></p>
    <p class="pet-trait" data-pet="trait"></p>
    <div class="pet-colors" aria-label="Pet colors" data-pet="colors"></div>
    <button type="button" class="pet-use" data-pet="use"></button>
    <p class="pet-notice" data-pet="notice" role="status" aria-live="polite"></p>
  </div>
</section>
<div class="pet-gallery" aria-label="Available pets"></div>
<p class="pet-footnote">Choose a card to preview. Your companion keeps its name and work status.</p>
