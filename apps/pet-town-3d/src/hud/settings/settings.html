<section
  class="town-settings"
  data-town-ui="settings"
  role="dialog"
  aria-labelledby="town-settings-title"
  aria-modal="true"
  hidden
>
  <header class="settings-header">
    <div>
      <h1 id="town-settings-title">Town settings</h1>
      <p>A little company for your time in town.</p>
    </div>
    <button type="button" class="close" data-a="close" aria-label="Close settings">Close ×</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Settings sections">
    <button
      type="button"
      id="town-tab-companion"
      role="tab"
      aria-controls="town-panel-companion"
      aria-selected="true"
      data-tab="companion"
    >
      Companions</button
    ><button
      type="button"
      id="town-tab-world"
      role="tab"
      aria-controls="town-panel-world"
      aria-selected="false"
      tabindex="-1"
      data-tab="world"
    >
      World</button
    ><button
      type="button"
      id="town-tab-help"
      role="tab"
      aria-controls="town-panel-help"
      aria-selected="false"
      tabindex="-1"
      data-tab="help"
    >
      How to play
    </button>
    <button
      type="button"
      id="town-tab-about"
      role="tab"
      aria-controls="town-panel-about"
      aria-selected="false"
      tabindex="-1"
      data-tab="about"
    >
      About
    </button>
  </nav>
  <div class="settings-body">
    <!-- SETTINGS_TAB_PANELS -->
  </div>
  <footer class="settings-footer">
    <span><kbd>H</kbd> Close · Back to town</span
    ><button type="button" data-a="reset">Reset world…</button>
  </footer>
</section>
