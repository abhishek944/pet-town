<main class="content">
  <div class="top">
    <div class="brand"><img src="/onboarding/app.png" alt="" />Pet Town</div>
    <span>Choose your coding tool</span>
  </div>
  <header class="intro">
    <h1>Who will your companion work with?</h1>
    <p>
      Choose a coding tool. We’ll check that it’s installed. You may need to sign in or approve its
      first session in Herdr.
    </p>
  </header>
  <div class="tool-grid">
    <button class="tool" type="button" data-tool="codex" aria-pressed="true">
      <span class="tool-icon" aria-hidden="true">◎</span
      ><span class="tool-info"><b>Codex</b><small>Found on this Mac</small></span></button
    ><button class="tool" type="button" data-tool="claude" aria-pressed="false">
      <span class="tool-icon" aria-hidden="true">C</span
      ><span class="tool-info"><b>Claude Code</b><small>Set up</small></span></button
    ><button class="tool" type="button" data-tool="pi" aria-pressed="false">
      <span class="tool-icon" aria-hidden="true">π</span
      ><span class="tool-info"><b>Pi</b><small>Found on this Mac</small></span></button
    ><button class="tool" type="button" data-tool="opencode" aria-pressed="false">
      <span class="tool-icon" aria-hidden="true">O</span
      ><span class="tool-info"><b>OpenCode</b><small>Set up</small></span></button
    ><button class="tool" type="button" data-tool="cursor" aria-pressed="false">
      <span class="tool-icon" aria-hidden="true">↗</span
      ><span class="tool-info"><b>Cursor Agent</b><small>Set up</small></span></button
    ><button class="tool" type="button" data-tool="droid" aria-pressed="false">
      <span class="tool-icon" aria-hidden="true">D</span
      ><span class="tool-info"><b>Factory Droid</b><small>Set up</small></span>
    </button>
  </div>
  <div class="check-panel" role="status">
    <b data-check-title></b>
    <p data-check-copy></p>
  </div>
  <div class="ready-note">Herdr is ready. Your first live companion comes next.</div>
  <div class="next">
    <button class="secondary" type="button">‹ Back</button
    ><button class="primary" type="button" data-check-tool>Check Codex →</button>
  </div>
  <footer class="bottom">
    <span>Use a tool you already know.</span><span>You can finish setup later.</span>
  </footer>
</main>
