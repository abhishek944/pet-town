<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pet Town Mayor</title>
    <link rel="stylesheet" href="/src/assistant.css" />
    <script type="module" src="/src/assistant.ts" defer></script>
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">Pet Town</span>
        <h1 id="assistant-title">Mayor</h1>
      </div>
      <span id="connection" class="status">Disconnected</span>
    </header>
    <main>
      <section class="voice-stage" aria-live="polite">
        <div id="voice-orb" class="voice-orb" aria-hidden="true"></div>
        <strong id="voice-state">Ready to connect</strong>
        <p>Say “Hey Mayor” or “Hey” plus your mayor’s name to start speaking.</p>
      </section>
      <section id="transcript" class="transcript" aria-label="Ephemeral conversation transcript">
        <p class="empty">This conversation disappears when the window closes.</p>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <footer>
      <button id="retry" class="secondary" type="button">Retry status</button
      ><button id="cancel" class="secondary" type="button" disabled>Stop Firstmate task</button
      ><button id="disconnect" class="secondary" type="button" disabled>End voice</button
      ><button id="connect" class="primary" type="button">Push to talk</button>
    </footer>
  </body>
</html>
