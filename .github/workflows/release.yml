name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-arm64
            asset: Pet-Town-macOS-Apple-Silicon.dmg
          - package: macos-x64
            asset: Pet-Town-macOS-Intel.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Validate updater signing and release version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater signing key secret" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing updater signing password secret" >&2; exit 1; }
          node scripts/create-update-manifest.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install dmgbuild
        run: PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install dmgbuild
      - name: Build DMG
        timeout-minutes: 45
        env:
          PACKAGE: ${{ matrix.package }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUIRE_SIGNED: "1"
          EXPECTED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/build.sh
      - name: Stage installer and signed updater
        run: |
          asset="${{ matrix.asset }}"
          case "${{ matrix.package }}" in
            macos-arm64) target=aarch64-apple-darwin ;;
            macos-x64) target=x86_64-apple-darwin ;;
          esac
          bundle="apps/pet-town/src-tauri/target/$target/release/bundle/macos"
          cp "bin/${{ matrix.package }}/pet-town.dmg" "$asset"
          cp "$bundle/Pet Town.app.tar.gz" "${asset%.dmg}.app.tar.gz"
          cp "$bundle/Pet Town.app.tar.gz.sig" "${asset%.dmg}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            Pet-Town-macOS-*.app.tar.gz
            Pet-Town-macOS-*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Pet-Town-macOS-*.dmg
          merge-multiple: true
          path: dist
      - name: Generate updater manifest after both Mac builds
        run: node scripts/create-update-manifest.mjs dist
      - name: Publish complete release and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$draft" != true ]]; then
              echo "Published updater releases are immutable. Create a new version tag." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            options=(--draft --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${options[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
