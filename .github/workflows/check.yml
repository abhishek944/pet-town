name: check

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned Pi runtime for target
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) package=macos-arm64 ;;
            x86_64-apple-darwin) package=macos-x64 ;;
          esac
          ./scripts/prepare-pi-runtime.sh "$package"
          cp "bin/$package/pet-town-pi-runtime.tar.gz" apps/pet-town/src-tauri/resources/
      - run: pnpm run check:flow
      - run: pnpm run check:remote-ui
      - name: Test agent broker at the declared MSRV
        run: cargo +1.88.0 test --locked --manifest-path apps/pet-town/src-tauri/Cargo.toml -p pet-town-agent-broker
      - run: pnpm exec turbo run build internal:build-frontend
      - name: Build locked Tauri target at the declared MSRV
        run: cargo +1.88.0 build --locked --manifest-path apps/pet-town/src-tauri/Cargo.toml --release --target ${{ matrix.target }}
      - name: Verify built architecture and Pi runtime
        run: |
          binary="apps/pet-town/src-tauri/target/${{ matrix.target }}/release/pet-town"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) package=macos-arm64; architecture=arm64 ;;
            x86_64-apple-darwin) package=macos-x64; architecture=x86_64 ;;
          esac
          file "$binary" | grep -q "Mach-O 64-bit executable $architecture"
          runtime_sha=$(shasum -a 256 "bin/$package/pet-town-pi-runtime.tar.gz" | cut -d' ' -f1)
          strings "$binary" | grep -F "$runtime_sha" >/dev/null
